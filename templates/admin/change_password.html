{% extends "base.html" %}

{% block title %}
Change Password
{% endblock %}

{% block content %}

<div class="admin-form">

    <h2>Change Password</h2>

    {% if message %}
        <p class="success-message">
            {{ message }}
        </p>
    {% endif %}

    {% if error %}
        <p class="error-message">
            {{ error }}
        </p>
    {% endif %}

    <form method="POST">

        <label>Current Password</label>

        <input
            type="password"
            name="current_password"
            required>

        <label>New Password</label>

        <input
            type="password"
            name="new_password"
            required>

        <label>Confirm New Password</label>

        <input
            type="password"
            name="confirm_password"
            required>

        <button type="submit" class="admin-btn">
            Update Password
        </button>

    </form>

</div>

{% endblock %}
